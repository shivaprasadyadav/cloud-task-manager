<!DOCTYPE html>
<html>
<head>
    <title>Cloud Task Manager</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <div class="container">

        <h1>Cloud Task Manager</h1>
        <p>Manage your daily tasks efficiently.</p>

        <form action="/add" method="POST">
            <input
                type="text"
                name="task"
                placeholder="Enter your task..."
                required
            >
            <button type="submit">Add Task</button>
        </form>

        <h2>My Tasks</h2>

        {% for task in tasks %}

        <div class="task">

            <span>{{ task.name }}</span>

            <span class="status">
                {{ task.status }}
            </span>

            {% if task.status == "Pending" %}
            <a href="/complete/{{ task.id }}">
                Complete
            </a>
            {% endif %}

            <a href="/delete/{{ task.id }}"
               class="delete">
                Delete
            </a>

        </div>

        {% else %}

        <p>No tasks available. Add your first task!</p>

        {% endfor %}

    </div>

</body>
</html>
